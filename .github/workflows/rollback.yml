name: Rollback staging

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to roll back to: "previous" (last successful deployment) or a commit SHA'
        required: true
        default: previous

concurrency:
  group: ci-cd-refs/heads/develop
  cancel-in-progress: false

env:
  IMAGE_NAME: quality-lab

jobs:
  rollback:
    name: Roll back staging to ${{ inputs.image_tag }}
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://${{ vars.APP_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: ACR login
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Point "latest" at the rollback image
        id: retag
        run: |
          REPO=${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}
          docker pull "$REPO:${{ inputs.image_tag }}"
          SHA=$(docker image inspect "$REPO:${{ inputs.image_tag }}" \
                --format '{{range .Config.Env}}{{println .}}{{end}}' | grep '^GIT_SHA=' | cut -d= -f2)
          echo "Rolling back to commit: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          docker tag "$REPO:${{ inputs.image_tag }}" "$REPO:latest"
          # Pushing :latest triggers the ACR webhook; App Service pulls and restarts.
          docker push "$REPO:latest"

      - name: Verify /health (database check + rolled-back version)
        run: bash scripts/verify-health.sh "${{ vars.APP_HOST }}" "${{ steps.retag.outputs.sha }}"
