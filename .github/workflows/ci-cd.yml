name: Quality Lab CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.x"
  API_PROJECT: src/QualityLab.Api/QualityLab.Api.csproj
  UNIT_TEST_PROJECT: tests/QualityLab.UnitTests/QualityLab.UnitTests.csproj
  INTEGRATION_TEST_PROJECT: tests/QualityLab.IntegrationTests/QualityLab.IntegrationTests.csproj
  COVERAGE_THRESHOLD: "60"
  IMAGE_NAME: quality-lab

jobs:
  # ── SCRUM-112: NuGet dependency audit ───────────────────────────────────────
  # Separate job so it shows as its own check on the PR and runs in parallel with the build.
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: |
          dotnet restore ${{ env.API_PROJECT }}
          dotnet restore ${{ env.UNIT_TEST_PROJECT }}
          dotnet restore ${{ env.INTEGRATION_TEST_PROJECT }}

      # Direct and transitive packages. High / Critical fail; Moderate / Low are reported only.
      - name: NuGet vulnerability audit
        run: >
          bash scripts/nuget-audit.sh
          ${{ env.API_PROJECT }}
          ${{ env.UNIT_TEST_PROJECT }}
          ${{ env.INTEGRATION_TEST_PROJECT }}

  # ── Build, test, image scan, migration script ───────────────────────────────
  build:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # coverage summary comment
      checks: write          # test results check (.trx)
      security-events: write # image scan results in the Security tab
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: |
          dotnet restore ${{ env.API_PROJECT }}
          dotnet restore ${{ env.UNIT_TEST_PROJECT }}
          dotnet restore ${{ env.INTEGRATION_TEST_PROJECT }}

      - name: Build
        run: dotnet build ${{ env.API_PROJECT }} --no-restore -c Release

      # ── Stage: unit tests ───────────────────────────────────────────────────
      - name: Unit tests
        run: >
          dotnet test ${{ env.UNIT_TEST_PROJECT }} --no-restore -c Release
          --settings coverlet.runsettings
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory test-results/unit

      # ── Stage: integration tests (throwaway MySQL via Testcontainers) ───────
      - name: Integration tests
        run: >
          dotnet test ${{ env.INTEGRATION_TEST_PROJECT }} --no-restore -c Release
          --settings coverlet.runsettings
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory test-results/integration

      - name: Publish test results (.trx)
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Test results
          path: test-results/**/*.trx
          reporter: dotnet-trx
          fail-on-error: false

      # ── Coverage: merge both runs into one report ───────────────────────────
      - name: Coverage report
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: test-results/**/coverage.cobertura.xml
          targetdir: coverage-report
          reporttypes: HtmlInline;Cobertura;JsonSummary;MarkdownSummaryGithub

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report

      - name: Coverage summary
        if: always()
        run: cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment coverage on PR
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          path: coverage-report/SummaryGithub.md

      - name: Enforce coverage threshold (${{ env.COVERAGE_THRESHOLD }}% lines)
        run: |
          COVERAGE=$(jq -r '.summary.linecoverage' coverage-report/Summary.json)
          echo "Line coverage: ${COVERAGE}% (minimum ${{ env.COVERAGE_THRESHOLD }}%)"
          awk -v c="$COVERAGE" -v t="${{ env.COVERAGE_THRESHOLD }}" \
            'BEGIN { if (c+0 < t+0) { print "Coverage below threshold"; exit 1 } }'

      - name: Generate idempotent migration script
        env:
          # Only needed so the app's startup code can build the DbContext.
          # Script generation never connects to a database.
          ConnectionStrings__QualityLabDb: "Server=localhost;Database=quality_lab;User=ci;Password=ci;"
        run: |
          dotnet tool restore
          mkdir -p artifacts
          dotnet ef migrations script --idempotent \
            --project ${{ env.API_PROJECT }} \
            --output artifacts/migrations.sql

      - name: Upload migration script
        uses: actions/upload-artifact@v4
        with:
          name: migration-script
          path: artifacts/migrations.sql

      - name: Docker build (validation)
        run: docker build -t ${{ env.IMAGE_NAME }}:ci .

      # ── SCRUM-112: container image scan ─────────────────────────────────────
      # Two passes over the same image. The first reports every severity to the Security tab and
      # never fails; the second is the gate, High / Critical only. Findings with no fix released
      # yet are excluded from the gate (nothing to upgrade to); they still appear in the report.
      # Triaged exceptions go in .trivyignore, each with a reason.
      - name: Image scan report (all severities)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:ci
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"

      - name: Upload image scan to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      - name: Image scan gate (High / Critical)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

  # ── Deploy to staging (develop only) ────────────────────────────────────────
  deploy-staging:
    name: Deploy to staging
    needs: [dependency-audit, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://${{ vars.APP_HOST }}
    steps:
      - uses: actions/checkout@v4

      # Push-only token scoped to the quality-lab repository (no Azure AD login needed).
      - name: ACR login
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Keep current image as "previous" (rollback target)
        run: |
          REPO=${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}
          if docker pull "$REPO:latest"; then
            docker tag "$REPO:latest" "$REPO:previous"
            docker push "$REPO:previous"
          else
            echo "No current image yet (first deployment)"
          fi

      - name: Build image
        run: |
          REPO=${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}
          docker build \
            --build-arg GIT_SHA=${{ github.sha }} \
            -t "$REPO:${{ github.sha }}" \
            -t "$REPO:latest" .

      # No second image scan here: this is the same commit and Dockerfile the build job scanned,
      # and this job cannot start unless that scan passed.

      # Pushing :latest triggers the ACR webhook; App Service continuous deployment
      # pulls the new image and restarts the container.
      - name: Push image
        run: docker push --all-tags ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}

      - name: Verify /health (database check + deployed version)
        run: bash scripts/verify-health.sh "${{ vars.APP_HOST }}" "${{ github.sha }}"

  # SCRUM-43: JMeter performance job goes here (needs: deploy-staging)
