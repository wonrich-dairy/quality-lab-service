services:
  quality-lab:
    build: .
    container_name: qls-api
    ports:
      - "5003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__QualityLabDb: "${QLS_DB_CONNECTION:?Set QLS_DB_CONNECTION in .env}"
      Kafka__BootstrapServers: "${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}"
      Kafka__SecurityProtocol: "${KAFKA_SECURITY_PROTOCOL:-Plaintext}"
      Kafka__SaslMechanism: "${KAFKA_SASL_MECHANISM:-}"
      Kafka__SaslUsername: "${KAFKA_SASL_USERNAME:-}"
      Kafka__SaslPassword: "${KAFKA_SASL_PASSWORD:-}"
    # When running with wonrich-infra's Kafka, join its network:
    #   docker compose -f docker-compose.yml up --build -d
    #   Then ensure this service can reach kafka:9092 via the shared network.
    # Alternatively, use localhost:29092 and set KAFKA_BOOTSTRAP_SERVERS accordingly.
